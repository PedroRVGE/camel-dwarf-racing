# =============================================================================
#  nginx sirviendo una aplicacion de una sola pagina
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    #  LA LINEA MAS IMPORTANTE DEL ARCHIVO
    # -------------------------------------------------------------------------
    #  En una aplicacion de una sola pagina, las direcciones como /carreras o
    #  /competidores/3f2a no existen como archivos: las inventa react-router
    #  dentro del navegador. nginx no sabe nada de eso.
    #
    #  Sin esta regla, entrar directo a /carreras (o simplemente apretar F5
    #  estando ahi) devuelve 404, porque nginx busca un archivo con ese nombre y
    #  no lo encuentra. Es el error clasico: en desarrollo no aparece nunca,
    #  porque el servidor de Vite ya hace esto, y en Docker se rompe todo lo que
    #  no sea la raiz.
    #
    #  try_files dice: busca el archivo, despues la carpeta, y si no existe
    #  ninguno de los dos, devolve index.html. Ahi arranca React, lee la
    #  direccion y dibuja la pantalla que corresponde.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    #  CACHE
    # -------------------------------------------------------------------------
    #  Los archivos que Vite empaqueta llevan una huella del contenido en el
    #  nombre (algo como index-4f3a91.js). Si el contenido cambia, cambia el
    #  nombre, asi que se pueden guardar para siempre sin riesgo de servir una
    #  version vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    #  index.html y config.js son la excepcion, y son justamente los dos que NO
    #  se pueden cachear: index.html es el que apunta a los nombres nuevos, y
    #  config.js trae las direcciones del entorno. Guardados en cache, un usuario
    #  seguiria abriendo la version anterior del sitio o pegandole a la API
    #  equivocada despues de un despliegue.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # -------------------------------------------------------------------------
    #  COMPRESION
    # -------------------------------------------------------------------------
    #  El paquete de JavaScript de React es de varios cientos de kilobytes de
    #  texto, y el texto se comprime muy bien. Es la mejora de velocidad mas
    #  barata que hay.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # -------------------------------------------------------------------------
    #  CABECERAS DE SEGURIDAD
    # -------------------------------------------------------------------------
    #  X-Content-Type-Options evita que el navegador adivine el tipo de un
    #  archivo y termine ejecutando como script algo que no lo era.
    add_header X-Content-Type-Options "nosniff" always;
    #  X-Frame-Options impide que otro sitio meta esta aplicacion dentro de un
    #  marco invisible para que un usuario haga clics sin darse cuenta.
    add_header X-Frame-Options "SAMEORIGIN" always;
    #  Referrer-Policy corta la fuga de direcciones internas hacia otros sitios.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # nginx anuncia su version en cada respuesta y en las paginas de error. No
    # tiene ninguna utilidad para el que navega y si para el que busca una
    # version con fallas conocidas.
    server_tokens off;
}

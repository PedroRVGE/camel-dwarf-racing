        LA CONFIGURACION SE CARGA ANTES QUE LA APLICACION, Y NO ES UN DETALLE

        Vite reemplaza las variables de entorno en el momento de COMPILAR, no en el

        construir la imagen de Docker entera.

        Por eso la direccion de la API y la de Keycloak se leen de este archivo
        suelto, que el contenedor reescribe al arrancar a partir de sus variables
        de entorno (frontend/docker/config.sh). La misma imagen sirve para
        cualquier entorno; solo cambia el .env.
    -->
